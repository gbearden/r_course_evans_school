<!-- Memo header. memo_header() in memo_setup.R replaces each {{field}}
     with the matching value from the memo's YAML `params`. -->
<div class="memo-title">MEMORANDUM</div>

<table class="memo-header">
  <tr><td>To:</td><td>{{to}}</td></tr>
  <tr><td>From:</td><td>{{from}}</td></tr>
  <tr><td>Date:</td><td>{{date}}</td></tr>
  <tr><td>Re:</td><td>{{re}}</td></tr>
</table>

<hr class="memo-rule">
